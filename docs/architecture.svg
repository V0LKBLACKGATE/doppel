<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1100" viewBox="0 0 1920 1100" role="img" aria-labelledby="title desc">
 <title id="title">Arquitetura — Pipeline de rebranding com IA</title>
 <desc id="desc">Chat with Claude via MCP server aciona o core/pipeline. O fluxo segue por fetcher em Docker isolado, brand-analyzer, claude-rebrander e revisão humana na Web UI local. A revisão retorna ao claude-rebrander para editar, ou aprova e segue para site-rewriter e exporter, com arquivo ZIP e prévia local.</desc>
